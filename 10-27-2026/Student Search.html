<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5</title>
    <h2>Student Search</h2>
    <hr>
</head>
<body>
    <label>Student Search <input id="search">
    </label>
    <p id="result">
    </p>
    <script>
        const search = document.querySelector('#search')
        const result = document.querySelector('#result')
        const students = ['Kiel', 'Elo', 'Sean', 'Lance', 'Cedric', 'Lourence', 'Jaspher']
        function runSearch() {
            const query = search.value.trim().toLowerCase();
            const matches = students.filter(name => name.toLowerCase().includes(query));
            result.textContent = !query? 'Enter a search term':
                (matches.join(', ')) || 'No Student Found';
        }
        search.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                runSearch();
            }
        });

    </script>
</body>
</html>
