<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3</title>
    <h2>Name Edit</h2>
    <hr>
</head>
<body>
    <table>
        <tbody>
            <tr id="row">
                <td id="studentName">Reze</td>

                <td>
                    <button id="editBtn">Edit</button>
                </td>
            </tr>
        </tbody>
    </table>

    <form id="editor" hidden>
        <label>Student name <input id="nameInput" required>
        </label>
        <button>Save</button>
    </form>

    <script>
        const row = document.querySelector('#row');
        const editor = document.querySelector('#editor');
        const nameInput = document.querySelector('#nameInput');
        const studentName = document.querySelector('#studentName');
        function openEditor() {
            editor.hidden = false;
            nameInput.value = studentName.textContent;
            nameInput.focus();
        }
        row.addEventListener('dbclick', openEditor);
        document.querySelector('#editBtn').addEventListener('click', openEditor)
        editor.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!nameInput.value.trim()) return;
            studentName.textContent = nameInput.value.trim();
            editor.hidden = true;
        });
    </script>

</body>
</html>
